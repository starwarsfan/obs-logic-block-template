[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# Renamed by init.py → obs-plugin-<your-type-name>
name = "obs-plugin-template"
version = "0.1.0"
description = "Custom logic block plugin for open bridge server"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

# Entry point that tells OBS to import this module at startup.
# The key (logic_template) is renamed by init.py to match your type_name.
[project.entry-points."obs.logic_blocks"]
logic_template = "obs_plugin_logic_template"

# Ships plugins/obs_plugin_logic_template.py as the top-level module obs_plugin_logic_template
# (init.py renames both along with your type_name). A unique module name lets several plugins be
# pip-installed side by side; a plain "plugin" module would overwrite another's.
[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.targets.wheel.force-include]
"plugins/obs_plugin_logic_template.py" = "obs_plugin_logic_template.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
